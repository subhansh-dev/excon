name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit health endpoint
        run: |
          URL="${{ secrets.RENDER_URL }}"
          if [ -z "$URL" ]; then
            echo "RENDER_URL secret not set — skipping"
            exit 0
          fi
          echo "Pinging $URL/api/health"
          curl -fsS --retry 3 --retry-delay 10 --max-time 30 "$URL/api/health"
