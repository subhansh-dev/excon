name: dssc-trainer
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dssc
      POSTGRES_PASSWORD: dssc
      POSTGRES_DB: dssc_trainer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dssc -d dssc_trainer"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
